<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumpkin Parlor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap">
<style>
  /* Layout: one rounded card filling the window; the 3D stage on top, a ruled control bar below (stacks on phones) */
  :root {
    --page: #140c1d;
    --card: #1b1227;
    --line: rgba(214, 190, 255, .12);
    --line-strong: rgba(214, 190, 255, .22);
    --ink: #f6eadb;
    --muted: #a898bb;
    --accent: #f7a35c;
    --accent-ink: #2a1408;
    --picked: rgba(247, 163, 92, .14);
    --track: #3a2a50;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Outfit", "Avenir Next", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); padding: 16px; }
  .card {
    height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 28px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .stage { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #stage.carving canvas { cursor: crosshair; }
  .eyebrow { margin: 0; font-size: .72rem; font-weight: 400; letter-spacing: .38em; text-transform: uppercase; color: var(--muted); }
  .masthead { position: absolute; top: 28px; left: 40px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 3rem; line-height: 1; letter-spacing: .005em; color: var(--ink); }
  .masthead .sub { color: var(--ink); opacity: .85; }
  .masthead .tag { margin-top: 44px; }
  .moon { position: absolute; top: 34px; right: 40px; width: 46px; height: 46px; color: #f8e6c8; filter: drop-shadow(0 0 10px rgba(255,230,190,.35)); pointer-events: none; }
  .hint { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; font-size: .95rem; letter-spacing: .14em; color: var(--muted); pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

  .bar { border-top: 1px solid var(--line-strong); padding: 26px 40px 28px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 22px 40px; }
  .pick { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .moods { display: grid; grid-template-columns: repeat(5, 8.6rem); gap: 10px; }
  .btn {
    font: 400 1.05rem var(--body); color: var(--ink); background: transparent;
    border: 1px solid var(--line-strong); border-radius: 12px; padding: 13px 18px; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: rgba(247,163,92,.55); }
  .btn:focus-visible, input[type=range]:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .moods .btn[aria-pressed="true"] { background: var(--picked); border-color: var(--accent); color: var(--accent); }
  .status { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; color: var(--muted); font-size: .98rem; letter-spacing: .04em; }
  .link { font: inherit; font-size: .88rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .link:hover { color: var(--ink); }

  .tools { width: 27rem; max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .width-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.05rem; }
  .width-head output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .92rem; margin-top: -2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 6px; background: linear-gradient(to right, var(--accent) var(--fill, 30%), var(--track) var(--fill, 30%)); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 6px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 10px; border-radius: 6px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -8px; border-radius: 50%; background: var(--accent); border: 3px solid #ffd2a6; box-shadow: 0 0 12px rgba(247,163,92,.6); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #ffd2a6; }
  .actions { display: flex; justify-content: flex-end; gap: 14px; margin-top: 12px; }
  .actions .btn { min-width: 9.5rem; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; min-width: 12rem; }
  .btn.primary:hover { background: #ffb575; }
  .btn.primary[aria-pressed="true"] { background: transparent; color: var(--accent); }

  #fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

  @media (max-width: 1180px) { .moods { grid-template-columns: repeat(3, minmax(0, 8.6rem)); } }
  @media (max-width: 700px) {
    body { padding: 10px; }
    .card { border-radius: 20px; }
    .masthead { top: 18px; left: 20px; gap: 4px; }
    h1 { font-size: 2.1rem; }
    .eyebrow { font-size: .6rem; letter-spacing: .3em; }
    .masthead .tag { display: none; }
    .moon { top: 20px; right: 20px; width: 32px; height: 32px; }
    .hint { bottom: 10px; font-size: .82rem; }
    .bar { padding: 16px 18px 18px; gap: 14px; }
    .pick { gap: 10px; width: 100%; }
    .moods { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .moods .btn { padding: 10px 2px; font-size: .8rem; border-radius: 10px; }
    .tools { width: 100%; gap: 6px; }
    .actions { margin-top: 6px; }
    .actions .btn { flex: 1; min-width: 0; padding: 11px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head><body>

<main class="card">
  <section class="stage">
    <div id="stage"></div>
    <div class="masthead">
      <h1>Pumpkin Parlor</h1>
      <p class="eyebrow sub">A little Halloween ritual</p>
      <p class="eyebrow tag">Carve a little personality</p>
    </div>
    <svg class="moon" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M30 6 A19 19 0 1 0 43 34 A16 16 0 1 1 30 6z"/></svg>
    <p class="hint" id="hint">Drag to turn your pumpkin</p>
  </section>

  <section class="bar">
    <div class="pick">
      <p class="eyebrow">Pick a personality</p>
      <div class="moods" role="group" aria-label="Personality">
        <button class="btn" data-face="blank" aria-pressed="true">Blank</button>
        <button class="btn" data-face="happy" aria-pressed="false">Happy</button>
        <button class="btn" data-face="scary" aria-pressed="false">Spooky</button>
        <button class="btn" data-face="surprised" aria-pressed="false">Surprised</button>
        <button class="btn" data-face="sleepy" aria-pressed="false">Sleepy</button>
      </div>
      <p class="status"><span id="status">Your blank pumpkin is ready for your own design.</span>
        <span><button class="link" id="undo">Undo</button> · <button class="link" id="newPumpkin">Start over</button></span></p>
    </div>
    <div class="tools">
      <label class="width-head" for="knifeSize"><span>Carving width</span><output id="sizeOut" for="knifeSize">10 px</output></label>
      <input type="range" id="knifeSize" min="4" max="30" value="10">
      <div class="ends" aria-hidden="true"><span>Thin</span><span>Wide</span></div>
      <div class="actions">
        <button class="btn" id="candle" aria-pressed="true">Candle on</button>
        <button class="btn primary" id="carveBtn" aria-pressed="false">Carve pumpkin</button>
      </div>
    </div>
  </section>
</main>
<div id="fail" hidden>Your browser can't show 3D graphics here. Try a recent Chrome, Safari or Firefox.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { document.getElementById('fail').hidden = false; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  // ---------- scene ----------
  const scene = new THREE.Scene();
  scene.background = (() => { // soft violet glow behind the pumpkin
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    const g = x.createRadialGradient(256, 230, 10, 256, 260, 360);
    g.addColorStop(0, '#6a4070'); g.addColorStop(0.2, '#4b2c74'); g.addColorStop(0.5, '#2e1c48'); g.addColorStop(1, '#1b1227');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 26; i++) {
      const bx = 60 + Math.random() * 392, by = 60 + Math.random() * 340, br = 1 + Math.random() * 2.5;
      x.fillStyle = `rgba(${Math.random() < .6 ? '190,150,255' : '255,210,150'},${0.25 + Math.random() * 0.4})`;
      x.beginPath(); x.arc(bx, by, br, 0, Math.PI * 2); x.fill();
    }
    return new THREE.CanvasTexture(c);
  })();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
  camera.position.set(0, 0.55, 5.2);

  scene.add(new THREE.HemisphereLight(0xc8a6e0, 0x3a2418, 0.45));
  const key = new THREE.DirectionalLight(0xffbf78, 0.85); key.position.set(2.5, 3, 4); scene.add(key);
  const halo = new THREE.PointLight(0xffc34a, 1.4, 4, 2); halo.position.set(0.4, 1.4, -1.6); scene.add(halo); // golden backlight
  const floorGlow = new THREE.PointLight(0xffb040, 0.7, 2.6, 2); floorGlow.position.set(0, -0.1, 1.7); scene.add(floorGlow); // warm pool on the pedestal
  const warm = new THREE.PointLight(0xffa048, 0.8, 6, 2); warm.position.set(-1.2, 0.6, 2.2); scene.add(warm);
  const rimL = new THREE.DirectionalLight(0x9b7bff, 0.6); rimL.position.set(-4, 2, -3); scene.add(rimL);
  const rimR = new THREE.DirectionalLight(0xc79bff, 0.55); rimR.position.set(4, 1.5, -3); scene.add(rimR);

  const GROUND = -0.7;
  const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x22162f, roughness: 0.92, metalness: 0 });
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.32, 1.36, 0.18, 96), pedestalMat);
  pedestal.position.y = GROUND - 0.09; scene.add(pedestal);
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.322, 0.01, 8, 128), new THREE.MeshBasicMaterial({ color: 0x4e3870 }));
  rimRing.rotation.x = Math.PI / 2; rimRing.position.y = GROUND; scene.add(rimRing);

  // ---------- carving textures (2:1, u around the pumpkin, v top to bottom) ----------
  const W = 2048, H = 1024;
  // carving maps run at half resolution (drawn in full-size coordinates) so each texture upload stays cheap
  const mkCanvas = (k = 1) => { const c = document.createElement('canvas'); c.width = W * k; c.height = H * k; const x = c.getContext('2d'); x.scale(k, k); return [c, x]; };
  const [colorC, colorX] = mkCanvas(), [alphaC, alphaX] = mkCanvas(0.5), [emitC, emitX] = mkCanvas(0.5);
  const colorTex = new THREE.CanvasTexture(colorC), alphaTex = new THREE.CanvasTexture(alphaC), emitTex = new THREE.CanvasTexture(emitC);
  [colorTex, alphaTex, emitTex].forEach(t => t.anisotropy = 4);

  // painterly skin, painted once: thick palette-knife daubs in oranges and golds, with olive, rose and mauve accents
  const [baseC, baseX] = mkCanvas();
  (() => {
    const x = baseX, g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6a5222'); g.addColorStop(0.12, '#bf5a1c'); g.addColorStop(0.55, '#cc611d'); g.addColorStop(0.9, '#a3401a'); g.addColorStop(1, '#6e2a14');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let k = 0; k < 10; k++) { // each lobe catches light down its middle
      const cx = (k + 0.5) / 10 * W, gg = x.createLinearGradient(cx - 0.05 * W, 0, cx + 0.05 * W, 0);
      gg.addColorStop(0, 'rgba(240,130,50,0)'); gg.addColorStop(0.5, 'rgba(240,130,50,.22)'); gg.addColorStop(1, 'rgba(240,130,50,0)');
      x.fillStyle = gg; x.fillRect(cx - 0.05 * W, H * 0.1, 0.1 * W, H * 0.8);
    }
    const PAL = [['#d9661e', 26], ['#e57a26', 18], ['#c4501a', 20], ['#a8401a', 12], ['#eb8f36', 6], ['#8a8a40', 6], ['#6f7a3c', 4], ['#9a5a7a', 4], ['#b84a2a', 6]];
    const total = PAL.reduce((a, p) => a + p[1], 0);
    const pick = () => { let r = Math.random() * total; for (const [c, w] of PAL) { if ((r -= w) < 0) return c; } return PAL[0][0]; };
    function daub(px, py, w, h, rot) {
      x.save(); x.translate(px, py); x.rotate(rot); x.beginPath();
      for (let i = 0; i < 9; i++) { const t = i / 9 * Math.PI * 2, k = 0.75 + Math.random() * 0.4; x[i ? 'lineTo' : 'moveTo'](Math.cos(t) * w * k, Math.sin(t) * h * k); }
      x.closePath(); x.fill(); x.restore();
    }
    for (let i = 0; i < 7000; i++) {
      const py = Math.random() * H, px = Math.random() * W, lat = Math.max(0.25, Math.sin(py / H * Math.PI));
      const w = (16 + Math.random() * 46) / lat, h = 9 + Math.random() * 22, rot = (Math.random() - 0.5) * 1.6;
      x.globalAlpha = 0.3 + Math.random() * 0.45; x.fillStyle = pick();
      daub(px, py, w, h, rot);
      if (px < w) daub(px + W, py, w, h, rot); else if (px > W - w) daub(px - W, py, w, h, rot);
    }
    x.globalAlpha = 1;
    for (let k = 0; k <= 10; k++) { // shadowed creases between the lobes (u = k/10)
      const gx = k / 10 * W, gg = x.createLinearGradient(gx - 36, 0, gx + 36, 0);
      gg.addColorStop(0, 'rgba(100,32,18,0)'); gg.addColorStop(0.5, 'rgba(100,32,18,.6)'); gg.addColorStop(1, 'rgba(100,32,18,0)');
      x.fillStyle = gg; x.fillRect(gx - 36, 0, 72, H);
    }
    const top = x.createLinearGradient(0, 0, 0, H * 0.16); // olive around the stem
    top.addColorStop(0, 'rgba(90,92,40,.9)'); top.addColorStop(1, 'rgba(90,92,40,0)');
    x.fillStyle = top; x.fillRect(0, 0, W, H * 0.16);
  })();
  colorX.drawImage(baseC, 0, 0); // the skin never changes; cuts only touch the alpha and glow maps
  function paintBase() {
    alphaX.fillStyle = '#fff'; alphaX.fillRect(0, 0, W, H);
    emitX.fillStyle = '#000'; emitX.fillRect(0, 0, W, H);
  }

  // carve one shape into all three maps; pathFn traces it on a context
  // face shapes: glowing rim drawn once with a blur (slow, but only a handful per face)
  function carveShape(pathFn, ring = 14) {
    emitX.save(); emitX.fillStyle = emitX.strokeStyle = '#a85418'; emitX.lineWidth = ring * 2; emitX.lineJoin = 'round';
    emitX.shadowColor = '#c85a08'; emitX.shadowBlur = 22;
    pathFn(emitX); emitX.stroke(); emitX.fill(); emitX.restore();
    alphaX.fillStyle = '#000'; pathFn(alphaX); alphaX.fill();
  }
  // brush dabs: a pre-rendered soft glow sprite instead of a live blur
  const glowDab = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(190,96,30,1)'); g.addColorStop(0.45, 'rgba(168,84,24,.9)'); g.addColorStop(1, 'rgba(120,45,5,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c; })();
  function dab(x, y, rx, ry) {
    emitX.drawImage(glowDab, x - rx * 2.2, y - ry * 2.2, rx * 4.4, ry * 4.4);
    alphaX.beginPath(); alphaX.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); alphaX.fill();
  }
  const ellipsePath = (x, y, rx, ry) => c => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); };
  const polyPath = pts => c => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };

  function stamp(x, y, r) { // brush dab, widened near the top so it stays round on the surface
    const lat = Math.max(0.3, Math.sin(y / H * Math.PI)), rx = r / lat;
    alphaX.fillStyle = '#000';
    dab(x, y, rx, r);
    if (x - rx * 2.2 < 0) dab(x + W, y, rx, r);
    if (x + rx * 2.2 > W) dab(x - W, y, rx, r);
    carvedArea += Math.PI * rx * r;
  }

  // ---------- faces (drawn in a 600px sketch space, mapped to the front of the pumpkin) ----------
  const s = 1.7, F = ([x, y]) => [0.25 * W + (x - 300) * s, 0.47 * H + (y - 350) * s];
  const ell = (x, y, a, b, n = 40) => Array.from({ length: n }, (_, i) => { const t = i / n * Math.PI * 2; return [x + a * Math.cos(t), y + b * Math.sin(t)]; });
  const quad = (p0, c, p1, n = 20) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u*u*p0[0] + 2*u*t*c[0] + t*t*p1[0], u*u*p0[1] + 2*u*t*c[1] + t*t*p1[1]]; });
  const crescent = (x1, x2, y, top, bot) => { const m = (x1 + x2) / 2; return [...quad([x1, y], [m, y + top], [x2, y]), ...quad([x2, y], [m, y + bot], [x1, y])]; };
  const P = pts => ({ t: 'poly', pts: pts.map(F) });
  const FACES = {
    happy: [
      P([[205,320],[245,245],[285,320]]), P([[315,320],[355,245],[395,320]]),
      P([[284,362],[300,335],[316,362]]),
      P([[180,385],[215,392],[225,375],[245,398],[300,402],[355,398],[375,375],[385,392],[420,385], ...quad([420,385],[300,540],[180,385]).slice(1)]),
    ],
    scary: [
      P([[185,262],[285,302],[205,325]]), P([[415,262],[315,302],[395,325]]),
      P([[290,365],[300,340],[310,365]]),
      P([[165,392],[200,412],[225,392],[255,418],[285,394],[315,418],[345,394],[375,418],[400,392],[435,392], ...quad([435,392],[300,520],[165,392]).slice(1)]),
    ],
    surprised: [
      P(ell(235, 285, 34, 40)), P(ell(365, 285, 34, 40)),
      P(ell(300, 350, 10, 12, 16)),
      P(ell(300, 425, 40, 50)),
    ],
    wink: [
      { t: 'dabs', r: 15, pts: quad([200,295],[240,262],[280,295], 24).map(F) },
      P(ell(360, 285, 32, 36)),
      P([[290,360],[300,340],[310,360]]),
      P(crescent(200, 420, 395, 20, 100).map(([x, y]) => [x, y - (x - 200) * 0.12])),
    ],
    sleepy: [
      { t: 'dabs', r: 12, pts: quad([205,292],[245,322],[285,292], 24).map(F) },
      { t: 'dabs', r: 12, pts: quad([315,292],[355,322],[395,292], 24).map(F) },
      P(ell(300, 410, 26, 20)),
    ],
    cheery: [
      { t: 'dabs', r: 14, pts: quad([205,305],[245,262],[285,305], 24).map(F) },
      { t: 'dabs', r: 14, pts: quad([315,305],[355,262],[395,305], 24).map(F) },
      P(crescent(215, 385, 385, 25, 120)),
    ],
    blank: [],
  };

  // ---------- history ----------
  let items = [], carvedArea = 0, texDirty = true;
  function applyItem(it) {
    if (it.t === 'poly') {
      carveShape(polyPath(it.pts));
      let a = 0; it.pts.forEach(([x, y], i) => { const [x2, y2] = it.pts[(i + 1) % it.pts.length]; a += x * y2 - x2 * y; });
      carvedArea += Math.abs(a) / 2;
    } else it.pts.forEach(([x, y, r]) => stamp(x, y, r || it.r));
  }
  function redraw() { carvedArea = 0; paintBase(); items.forEach(applyItem); texDirty = true; }

  // ---------- pumpkin ----------
  function pumpkinGeometry(scale, ws = 160, hs = 100) {
    const geo = new THREE.SphereGeometry(1, ws, hs), p = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {

    $('hint').textContent = carving ? (face === 'blank' ? 'Drag on the pumpkin to carve. Drag beside it to turn it.' : 'Trace the guide to carve. Drag beside the pumpkin to turn it.') : 'Drag to turn your pumpkin';
    const free = face === 'blank';
    say(carving ? (free ? 'Carve any face or pattern you like.' : `Carve along the lines to give it a ${NAMES[face]} face.`)
      : items.length ? 'Your pumpkin is glowing. Spin it to admire.'
      : free ? 'Your blank pumpkin is ready for your own design.' : `Your ${NAMES[face]} pumpkin is ready to carve.`);
    if (carving) { // turn the face toward the carver
      const d = camera.position.distanceTo(controls.target);
      camera.position.set(0, controls.target.y + d * 0.18, d * 0.98);
    }
  }
  $('carveBtn').onclick = () => setMode(mode === 'carve' ? 'spin' : 'carve');
  document.querySelectorAll('[data-face]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-face]').forEach(o => o.setAttribute('aria-pressed', o === b));
    face = b.dataset.face; drawGuide(); setMode(mode);
  });
  const size = $('knifeSize');
  const setSize = () => { brush = +size.value; $('sizeOut').textContent = size.value + ' px'; size.style.setProperty('--fill', ((size.value - size.min) / (size.max - size.min) * 100) + '%'); };
  size.oninput = setSize; setSize();
  const undo = () => { items.pop(); redraw(); };
  $('undo').onclick = undo;
  addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); } });
  $('newPumpkin').onclick = () => { items = []; redraw(); setMode(mode); };
  let candle = true;
  $('candle').onclick = () => { candle = !candle; $('candle').setAttribute('aria-pressed', candle); $('candle').textContent = candle ? 'Candle on' : 'Candle off'; };
  drawGuide();

  // ---------- loop ----------
  redraw(); // start with an uncarved pumpkin
  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    flushCarve();
    if (texDirty) { alphaTex.needsUpdate = emitTex.needsUpdate = true; texDirty = false; }
    const flick = 0.85 + 0.09 * Math.sin(now / 90) + 0.05 * Math.sin(now / 37 + 1) + 0.04 * Math.sin(now / 13);
    const open = Math.min(1, carvedArea / 120000);
    const on = candle ? 1 : 0;
    innerLight.intensity = 1.2 * flick * on;
    spill.intensity = 1.4 * open * flick * on;
    shellMat.emissiveIntensity = 0.6 * flick * on;
    innerMat.emissive.setRGB(0.16 * flick * on, 0.05 * flick * on, 0.005 * on);
    for (const m of wallMats) m.emissiveIntensity = 0.28 * m.userData.depth * flick * on; // inner flesh catches the candle
    flame.visible = candle;
    flame.scale.set(0.1 * flick, 0.2 * (0.9 + 0.2 * Math.sin(now / 60)), 1);
    stepParticles(dt); stepMagic(dt, now);
    controls.update();
    composer.render();
  });
})();
</script>
</body></html>
